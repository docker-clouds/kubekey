---
# Back up existing containerd config/binaries before upgrading CRI.
# On a fresh cluster create there is nothing to back up, so this is skipped.
- name: Containerd | Backup containerd configuration and binaries before upgrade
  when:
    - .kubernetes_install_LoadState.stdout | default "" | eq "loaded"
    - .upgrade.cri
  command: |
    BACKUP_DIR="/etc/kubekey/backup/containerd/$(date +%Y%m%d-%H%M%S)"
    mkdir -p "${BACKUP_DIR}"
    cp /etc/containerd/config.toml "${BACKUP_DIR}/" 2>/dev/null || true
    cp /usr/local/bin/containerd "${BACKUP_DIR}/" 2>/dev/null || true
    cp /usr/local/bin/ctr "${BACKUP_DIR}/" 2>/dev/null || true
    cp /usr/local/bin/runc "${BACKUP_DIR}/" 2>/dev/null || true
    echo "✅ Containerd backup saved to ${BACKUP_DIR}"

- name: Containerd | Sync Containerd binaries
  block:
    - name: Containerd | Verify if runc is installed on the system
      ignore_errors: true
      command: runc --version
      register: runc_install_version 
    - name: Containerd | Ensure the runc binary is present on the remote node
      when: or (.runc_install_version.error | empty | not) (.runc_install_version.stdout | regexMatch (printf "runc version %s\\s+" (.cri.runc_version | default "" | trimPrefix "v" )) | not)
      copy:
        src: >-
          {{ .binary_dir }}/runc/{{ .cri.runc_version }}/{{ .binary_type }}/runc.{{ .binary_type }}
        dest: /usr/local/bin/runc
        mode: 0755
    - name: Containerd | Check if containerd is installed on the system
      ignore_errors: true
      command: containerd --version
      register: containerd_install_version
    - name: Containerd | Install and configure containerd if not present or version mismatch
      when: or (.containerd_install_version.error | empty | not) (.containerd_install_version.stdout | contains (printf " %s " .cri.containerd_version) | not)
      block:
        - name: Containerd | Copy containerd binary archive to the remote node
          copy:
            src: >-
              {{ .binary_dir }}/containerd/{{ .cri.containerd_version }}/{{ .binary_type }}/containerd-{{ .cri.containerd_version | default "" | trimPrefix "v" }}-linux-{{ .binary_type }}.tar.gz
            dest: >-
              {{ .tmp_dir }}/containerd-{{ .cri.containerd_version | default "" | trimPrefix "v" }}-linux-{{ .binary_type }}.tar.gz
        - name: Containerd | Extract containerd binaries to /usr/local/bin
          command: |
            tar -xvf {{ .tmp_dir }}/containerd-{{ .cri.containerd_version | default "" | trimPrefix "v" }}-linux-{{ .binary_type }}.tar.gz --strip-components=1 -C /usr/local/bin/

- name: Containerd | Synchronize image registry TLS certificates to the remote node
  block:
    - name: Containerd | Copy image registry CA certificate to the remote node
      when: .image_registry.auth.ca_file | fileExists
      copy:
        src: >-
          {{ .image_registry.auth.ca_file }}
        dest: >-
          /etc/containerd/certs.d/{{ .image_registry.auth.registry | splitList "/" | first }}/ca.crt
    - name: Containerd | Copy image registry client certificate to the remote node
      when:
      - .image_registry.auth.cert_file | fileExists
      copy:
        src: >-
          {{ .image_registry.auth.cert_file }}
        dest: >-
          /etc/containerd/certs.d/{{ .image_registry.auth.registry | splitList "/" | first }}/client.crt
    - name: Containerd | Copy image registry client key to the remote node
      when:
      - .image_registry.auth.key_file | fileExists
      copy:
        src: >-
          {{ .image_registry.auth.key_file }}
        dest: >-
          /etc/containerd/certs.d/{{ .image_registry.auth.registry | splitList "/" | first }}/client.key

- name: Containerd | Configure containerd
  when: or (.containerd_install_version.error | empty | not) (.containerd_install_version.stdout | contains (printf " %s " .cri.containerd_version) | not) (.cri.containerd.config_policy | empty | not)
  block:
    - name: Containerd | Read existing containerd configuration
      when: .cri.containerd.config_policy | eq "merge"
      ignore_errors: true
      command: cat /etc/containerd/config.toml
      register: containerd_config_existing
    - name: Containerd | Generate the containerd configuration file
      template:
        src: config.toml
        dest: /etc/containerd/config.toml
    # ── volcorch 规范化：ascend runtime + 额外 registry（数据源: config spec
    #    .extra_registries，由部署侧脚本从站点文件注入；
    #    空默认兜底在 defaults/main/03-extra-registries.yaml）──
    # 设计约束（勿改回"存在即跳过"式的幂等检查）：
    #   - 任意位置、任意格式的既有 ascend 段一律删除后重写（自愈手工编辑产生的错误格式，
    #     典型事故：BinaryName 放在段顶层而非 options 下，containerd 静默忽略导致 vNPU 硬切失效）
    #   - 与声明 registry 重复的 mirror/tls 表一并删除（防止 TOML 重复定义使 containerd 拒绝启动）
    #   - 全部改动收在 # BEGIN/END volcorch-managed 标记块内，备份写入 config.toml.volcorch-bak
    #   - 重启后用 `containerd config dump` 校验生效配置，不通过则整个 play 失败（fail-fast）
    - name: Containerd | Normalize config.toml (ascend runtime + extra registries)
      command: |
        set -e
        CFG=/etc/containerd/config.toml
        cp "$CFG" "$CFG.volcorch-bak"
        awk '/^# BEGIN volcorch-managed$/,/^# END volcorch-managed$/ {next} {print}' "$CFG" > "$CFG.tmp" && mv "$CFG.tmp" "$CFG"
        awk '/^[ \t]*$/{tail = tail $0 "\n"; next} {printf "%s", tail; tail = ""; print}' "$CFG" > "$CFG.tmp" && mv "$CFG.tmp" "$CFG"
        awk -v REGS='{{ range .extra_registries | default list }}{{ .registry }} {{ end }}' '
        BEGIN {
          skip = 0; buf = ""
          n = split(REGS, arr, " ")
          for (i = 1; i <= n; i++) {
            m1[i] = "[plugins.\"io.containerd.grpc.v1.cri\".registry.mirrors.\"" arr[i] "\"]"
            m2[i] = "[plugins.\"io.containerd.grpc.v1.cri\".registry.configs.\"" arr[i] "\""
          }
        }
        function flushbuf() { printf "%s", buf; buf = "" }
        {
          if ($0 ~ /^[ \t]*#/ || $0 ~ /^[ \t]*$/) { buf = buf $0 "\n"; next }
          if ($0 ~ /^[ \t]*\[/) {
            drop = (index($0, ".runtimes.ascend]") > 0 || index($0, ".runtimes.ascend.") > 0)
            if (!drop) for (i = 1; i <= n; i++) if (index($0, m1[i]) > 0 || index($0, m2[i]) > 0) { drop = 1; break }
            if (drop) { buf = ""; skip = 1; next }
            flushbuf(); printf "%s\n", $0; skip = 0; next
          }
          flushbuf()
          if (!skip) printf "%s\n", $0
        }
        END { flushbuf() }' "$CFG" > "$CFG.tmp" && mv "$CFG.tmp" "$CFG"
        cat >> "$CFG" <<'VOLCORCH_EOF'

        # BEGIN volcorch-managed
        # volcorch-managed CRI config. DO NOT edit manually - redeploy normalizes this block.
        # Declare registries in runtime/clusters/<cluster>/extra-registries.yaml (site volume).
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.ascend]
          runtime_type = "io.containerd.runc.v2"
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.ascend.options]
            BinaryName = "/usr/local/bin/ascend-docker-runtime"
            SystemdCgroup = true
        {{- range .extra_registries | default list }}
        [plugins."io.containerd.grpc.v1.cri".registry.mirrors."{{ .registry }}"]
          endpoint = ["{{ .endpoint | default (printf "http://%s" .registry) }}"]
        {{- if .insecure_skip_verify }}
        [plugins."io.containerd.grpc.v1.cri".registry.configs."{{ .registry }}".tls]
          insecure_skip_verify = true
        {{- end }}
        {{- end }}
        # END volcorch-managed
        VOLCORCH_EOF
    - name: Containerd | Ensure ascend-docker-runtime symlink when driver is present
      command: |
        if [ -x /usr/local/Ascend/Ascend-Docker-Runtime/ascend-docker-runtime ]; then
          ln -sf /usr/local/Ascend/Ascend-Docker-Runtime/ascend-docker-runtime /usr/local/bin/ascend-docker-runtime
          echo "symlink ensured: /usr/local/bin/ascend-docker-runtime"
        else
          echo "skip: Ascend driver not present on this node"
        fi
- name: Containerd | Deploy the containerd systemd service file
  when: or (.containerd_install_version.error | empty | not) (.containerd_install_version.stdout | contains (printf " %s " .cri.containerd_version) | not) (.cri.containerd.config_policy | empty | not)
  copy:
    src: containerd.service
    dest: /etc/systemd/system/containerd.service
- name: Containerd | Start and enable the containerd service
  when: or (.containerd_install_version.error | empty | not) (.containerd_install_version.stdout | contains (printf " %s " .cri.containerd_version) | not) (.cri.containerd.config_policy | empty | not)
  command: |
    systemctl daemon-reload && systemctl restart containerd.service && systemctl enable containerd.service
    # docker（若在运行，如 image_registry 节点）跟随重启：containerd 重启会 SIGKILL
    # 其容器（registry 实证 Exited 137），而 dockerd 运行中对外部 containerd 死容器
    # 的 restart manager 恢复不可靠；dockerd 重启路径则可靠 —— daemon 启动时会
    # 恢复 restart=always 的容器，registry 随之回归
    #
    # 注意 systemd 语义：stop docker 会经 Requires= 把 docker-registry 一并停止
    # （ExecStop=compose down 删容器），但 start docker **不会**反向传播 start
    # docker-registry —— 必须显式 restart registry 并等 443 就绪，否则 kubeadm
    # 拉控制面镜像时 connection refused（journal 实证 13:06/13:09 两轮）
    systemctl is-active --quiet docker.service && systemctl restart docker.service || true
    if systemctl is-enabled --quiet docker-registry.service 2>/dev/null; then
      systemctl restart docker-registry.service
      for i in $(seq 1 30); do
        timeout 2 bash -c '</dev/tcp/127.0.0.1/443' 2>/dev/null && exit 0
        sleep 2
      done
      echo "ERROR: registry 443 not ready after containerd/docker restart" >&2
      exit 1
    fi

# Note: when upgrade.cri is false the whole `cri` role is skipped at the
# playbook level (upgrade_cluster.yaml), so containerd is left untouched
# during a Kubernetes-only upgrade.

- name: Containerd | Fail fast unless ascend runtime is effective in dumped config
  when: or (.containerd_install_version.error | empty | not) (.containerd_install_version.stdout | contains (printf " %s " .cri.containerd_version) | not) (.cri.containerd.config_policy | empty | not)
  command: |
    if ! containerd config dump 2>/dev/null | awk '/runtimes\.ascend\.options\]/{f=1; next} f && /^\[/{f=0} f && /BinaryName/{ok=1} END{exit(ok?0:1)}'; then
      echo "FATAL: effective containerd config lacks BinaryName under runtimes.ascend.options."
      echo "       /etc/containerd/config.toml was likely hand-edited; backup at /etc/containerd/config.toml.volcorch-bak"
      exit 1
    fi
